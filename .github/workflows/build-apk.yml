name: Build APK

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x android-app/gradlew
    
    - name: Build Debug APK
      run: |
        cd android-app
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyDevice-Agent-APK
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release APK
      run: |
        cd android-app
        ./gradlew assembleRelease || true

    - name: Upload Release APK (if available)
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: MyDevice-Agent-Release-APK
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: ignore
